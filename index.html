<style>
/* Layout: a phone-width app. One scrolling screen above a bottom bar, with sheets that rise over it and an effects layer on top. */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --outside:#F3E6EC; --ink:#2A1620; --muted:#6B5560; --line:#F0DEE6;
  --primary:#8E1F4F; --primary-soft:#F7E9EF; --on-primary:#FFFFFF;
  --gold:#FFB627; --teal:#0F7C7C; --violet:#5B3FA8; --coral:#C8442E; --stage:#0F7C7C; --stage-2:#0B6464;
  --r:22px; --pill:999px;
  --font:"Baloo Bhaijaan 2",Tahoma,sans-serif;
  --dur:440ms; --ease:cubic-bezier(.34,1.56,.64,1);
}
:root[data-accent="teal"]{--primary:#0B6E6E;--primary-soft:#DDF0F0;--stage:#8E1F4F;--stage-2:#701A40}
:root[data-accent="violet"]{--primary:#5B3FA8;--primary-soft:#ECE6F7}
:root[data-radius="soft"]{--r:12px;--pill:12px}
:root[data-font="cairo"]{--font:"Cairo",Tahoma,sans-serif}
:root[data-font="tajawal"]{--font:"Tajawal",Tahoma,sans-serif}
:root[data-motion="soft"]{--dur:300ms;--ease:cubic-bezier(.2,.8,.2,1)}
:root[data-motion="playful"]{--dur:440ms;--ease:cubic-bezier(.34,1.56,.64,1)}
:root[data-motion="party"]{--dur:560ms;--ease:cubic-bezier(.3,1.9,.5,1)}
:root[data-motion="fast"]{--dur:150ms;--ease:cubic-bezier(.2,.8,.2,1)}

[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--outside);color:var(--ink);font:500 17px/1.5 var(--font);overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,p,ul,ol,dl,dd{margin:0;padding:0}
ul,ol{list-style:none}
h1{font-size:34px;line-height:1.25;font-weight:800;text-wrap:balance}
h2{font-size:19px;line-height:1.3;font-weight:700}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}

#app{position:relative;height:100%;max-width:430px;margin-inline:auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (max-width:430px){body{background:var(--bg)}}
#view{position:relative;flex:1;min-height:0;perspective:1200px;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;box-sizing:border-box;padding-block:12px 24px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;background:var(--bg);isolation:isolate;backface-visibility:hidden}
.screen.leaving{pointer-events:none}
.sub{color:var(--muted)}
.small{font-size:15px;color:var(--muted)}
.brand{font-size:32px;font-weight:800;line-height:1;color:var(--primary)}
.top{display:flex;align-items:center;justify-content:space-between;min-height:48px}
.bar{display:flex;align-items:center;gap:8px;min-height:48px}
.bar h1{font-size:24px}
.icon-btn{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;border:0;border-radius:var(--pill);background:var(--primary-soft);color:var(--primary)}
.pill-btn{min-height:44px;display:flex;align-items:center;gap:6px;padding:0 14px;border:0;border-radius:var(--pill);background:var(--primary-soft);color:var(--primary);font-size:16px;font-weight:700;flex:none}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{height:112px;box-sizing:border-box;padding:12px 14px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;border:0;border-radius:var(--r);font-size:22px;font-weight:700;line-height:1.1;text-align:start}
.tile-idea{background:var(--bg);color:var(--primary);border:2px dashed var(--primary)}
.circles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.circle{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:0;font-size:15px}
.circle span{width:56px;height:56px;display:flex;align-items:center;justify-content:center;border-radius:var(--pill);background:var(--primary-soft);color:var(--primary)}
.note-demo{font-size:14px;color:var(--muted);text-align:center}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;box-sizing:border-box;padding:0 16px;border:0;border-radius:var(--pill);background:var(--primary-soft);color:var(--ink);font-size:16px;font-weight:500;transition:background var(--dur) ease,color var(--dur) ease}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);font-weight:700}
:root[data-chipfx="check"] .chip[aria-pressed="true"]::before{content:"✓";margin-inline-end:5px}
.chip .rec{color:var(--gold);margin-inline-end:4px}
.lab-stage .chip:not([aria-pressed="true"]){background:var(--bg)}

.grid-p{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card-p{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px;border:0;border-radius:var(--r);background:var(--primary-soft)}
.card-p svg{width:96px;height:112px}
.card-p b{font-size:18px;font-weight:700}
.tag{font-size:13px;color:var(--primary);font-weight:700}

.hero-art{height:204px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--gold);border-radius:var(--r)}
.hero-art svg{height:172px;width:auto}
.field{display:flex;flex-direction:column;gap:4px}
.field label,.label{font-size:18px;font-weight:700}
.input{box-sizing:border-box;width:100%;border:0;border-radius:calc(var(--r) * .7);background-color:var(--primary-soft);background-image:linear-gradient(var(--primary),var(--primary));background-repeat:no-repeat;background-position:50% 100%;background-size:0 4px;padding:12px 16px;font-size:18px;resize:none;outline:none;transition:box-shadow var(--dur) ease,transform var(--dur) var(--ease),background-size var(--dur) ease}
:root[data-focus="glow"] .input:focus,:root[data-focus="glow"] .input.focused{box-shadow:0 0 0 3px var(--primary),0 0 18px 3px var(--primary)}
:root[data-focus="lift"] .input:focus,:root[data-focus="lift"] .input.focused{transform:translateY(-5px) scale(1.015);box-shadow:0 12px 20px -8px var(--primary)}
:root[data-focus="line"] .input:focus,:root[data-focus="line"] .input.focused{background-size:100% 4px}
.btn{min-height:56px;box-sizing:border-box;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--pill);background:var(--primary);color:var(--on-primary);font-size:19px;font-weight:700;transition:opacity var(--dur)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{background:var(--bg);color:var(--primary);border:2px solid var(--primary)}
.btn.gold{background:var(--gold);color:var(--ink)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dashed{min-height:48px;width:100%;border:2px dashed var(--primary);background:none;color:var(--primary);border-radius:var(--pill);font-size:17px;font-weight:700}

.item{display:flex;align-items:center;gap:12px;padding:10px 6px 10px 12px;background:var(--primary-soft);border-radius:var(--r);box-sizing:border-box}
.item .bub{width:56px;height:56px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--primary);color:var(--on-primary);border-radius:var(--pill)}
.item .tx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.item .tx b{font-size:18px;font-weight:700}
.item .tx span{font-size:15px;color:var(--muted);overflow-wrap:anywhere}
.x-btn{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;border:0;background:none;color:var(--muted)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding-block:40px}
.empty .bub{width:88px;height:88px;display:flex;align-items:center;justify-content:center;background:var(--primary-soft);color:var(--primary);border-radius:var(--pill);animation:bob 2.4s ease-in-out infinite}
.when-pick{min-height:64px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:2px dashed var(--primary);border-radius:var(--r);background:var(--primary-soft);color:var(--primary);font-size:18px;font-weight:700}
.when-pick svg{animation:bob 2.4s ease-in-out infinite}
.when{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r);background:var(--primary-soft)}
.when.rush{background:#FFF0CC}
.when-n{width:66px;height:66px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--primary);color:var(--on-primary);border-radius:18px;line-height:1.1}
.when.rush .when-n{background:var(--gold);color:var(--ink)}
.when-n b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.when-n span{font-size:13px}
.when-tx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.when-tx b{font-size:16px;font-weight:700}
.when-tx span{font-size:14px;color:var(--muted)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-head b{font-size:18px;font-weight:700}
.cal-head .icon-btn[disabled]{opacity:.3;cursor:default}
.cal-week,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;text-align:center}
.cal-week{font-size:14px;color:var(--muted);margin-bottom:2px}
.cal-d{height:44px;border:0;border-radius:12px;background:none;font-size:17px;font-weight:700;padding:0;transition:background var(--dur) ease,color var(--dur) ease}
.cal-d.calm{background:#DDF0F0;color:#0B6464}
.cal-d.rush{background:#FFE6AE;color:#5E4A18}
.cal-d.no{background:#F6E4E0;color:#A63522}
.cal-d.past{color:#C9BAC1;cursor:default}
.cal-d[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:13px;height:13px;border-radius:4px}
.count-line{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:700;color:var(--primary)}
.banner{width:100%;min-height:82px;display:flex;align-items:center;gap:12px;padding:12px 14px;box-sizing:border-box;border:0;border-radius:var(--r);background:var(--gold);color:var(--ink);text-align:start}
.banner>svg:first-child{animation:bob 2.4s ease-in-out infinite}
.banner span{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.banner b{font-size:20px;font-weight:800}
.banner small{font-size:14px}
.banner.soft{background:var(--primary-soft);color:var(--primary)}
.row-head{display:flex;align-items:center;justify-content:space-between}
.link{min-height:44px;padding:0 4px;border:0;background:none;color:var(--primary);font-size:16px;font-weight:700}
.strip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-inline:-18px;padding-inline:18px;flex:none}
.strip::-webkit-scrollbar{display:none}
.strip .idea-card{flex:0 0 132px}
.idea-card{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px;box-sizing:border-box;border:0;border-radius:var(--r);background:var(--primary-soft);text-align:center;min-width:0}
.idea-card svg{height:96px;width:auto}
.idea-card b{font-size:16px;font-weight:700;line-height:1.25}
.idea-big{height:190px;display:flex;align-items:center;justify-content:center;background:var(--primary-soft);border-radius:var(--r)}
.idea-big svg{height:168px;width:auto}
.pack-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pack-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px;border:0;border-radius:var(--r);background:var(--primary-soft);font-size:15px;transition:opacity var(--dur) ease,filter var(--dur) ease}
.pack-card:last-child{grid-column:1/-1}
.pack-card b{font-weight:700}
.pa svg{height:92px;width:auto;display:block}
.pk{position:absolute;top:8px;inset-inline-start:8px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:var(--primary);color:var(--on-primary);border-radius:50%;transition:transform var(--dur) var(--ease)}
.pack-card[aria-pressed="false"]{opacity:.45;filter:grayscale(1)}
.pack-card[aria-pressed="false"] .pk{transform:scale(0)}
.bell{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;border:0;background:none;color:var(--muted);transition:color var(--dur) ease}
.bell[aria-pressed="true"]{color:var(--primary)}
.lib-designs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lib-designs .link{min-height:40px;font-size:15px}
.ping{position:absolute;top:10px;inset-inline:12px;z-index:55;display:flex;align-items:center;gap:10px;padding:12px;background:var(--bg);border-radius:var(--r);box-shadow:0 12px 30px rgba(42,22,32,.32);font-size:15px;line-height:1.35}
.ping .bub{width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--primary);color:var(--on-primary);border-radius:12px}
.ping b{display:block;font-size:16px}

.steps{display:flex;flex-direction:column}
.step{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:14px;color:var(--muted)}
.step .ln{position:absolute;right:13px;top:30px;bottom:0;width:2px;background:var(--line);transform-origin:top}
.step.done .ln{background:var(--primary)}
.step .dot{width:28px;height:28px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:var(--pill);background:var(--line);color:var(--muted);font-size:14px;font-weight:700}
.step.done .dot{background:var(--primary);color:var(--on-primary)}
.step.now{color:var(--ink);font-weight:700}
.step.now .dot{background:var(--gold);color:var(--ink);transform:scale(1.12)}
:root[data-timeline="pulse"] .step.now .dot{animation:dotPulse 1.3s ease-in-out infinite}
.act-card{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:var(--r);background:var(--primary-soft)}
.act-card b{font-size:21px;font-weight:800;line-height:1.3}
.demo-btn{min-height:46px;border:2px dashed var(--muted);border-radius:var(--pill);background:none;color:var(--muted);font-size:16px}
.lines{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;font-size:17px}
.lines dd{font-weight:700;font-variant-numeric:tabular-nums}
.total{border-top:2px solid var(--line);padding-top:8px;font-size:21px;font-weight:800}
.warn{padding:10px 14px;border-radius:calc(var(--r) * .6);background:#FFF0CC;color:#5E4A18;font-size:15px}
.scan{position:relative;height:84px;width:66px;align-self:center;border-radius:8px;background:#fff;overflow:hidden;box-shadow:0 0 0 2px var(--line)}
.scan i{position:absolute;inset-inline:0;top:0;height:5px;background:var(--gold);box-shadow:0 0 14px 4px var(--gold);animation:scan 1s ease-in-out infinite alternate}
.loader-row{display:flex;justify-content:center;padding-block:6px}

.s-review{padding:0;gap:0;background:var(--stage);overflow:hidden;color:#fff}
.s-review .bar{padding:8px max(14px,env(safe-area-inset-right,0px)) 4px max(14px,env(safe-area-inset-left,0px));flex:none}
.s-review .bar h1{font-size:22px}
.s-review .bar .icon-btn{background:#fff;color:var(--ink)}
.stage{position:relative;flex:1;min-height:210px;overflow:hidden;touch-action:none}
#gl,#ink,#labGl{position:absolute;inset:0;width:100%;height:100%;display:block}
#gl,#labGl{touch-action:none}
#ink{pointer-events:none}
#art2d{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#art2d svg{height:82%;width:auto}
.pin2d{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;display:flex;align-items:center;justify-content:center;background:var(--gold);color:var(--ink);border-radius:50%;font-size:15px;font-weight:800}
#status3d,#labStatus{--primary:#fff;--primary-soft:rgba(255,255,255,.3);position:absolute;inset-inline:0;top:42%;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:#fff}
.tools{position:absolute;top:10px;inset-inline-end:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.tool{width:50px;height:50px;display:flex;align-items:center;justify-content:center;border:0;border-radius:var(--pill);background:var(--stage-2);color:#fff;transition:background var(--dur) ease,color var(--dur) ease}
.tool[aria-pressed="true"]{background:var(--gold);color:var(--ink)}
.hint3d{position:absolute;inset-inline:0;bottom:30px;text-align:center;font-size:15px;pointer-events:none}
#doneInk{position:absolute;top:12px;inset-inline-start:14px;min-height:46px;padding:0 18px;border:0;border-radius:var(--pill);background:var(--gold);color:var(--ink);font-size:17px;font-weight:700}
.panel{position:relative;flex:none;margin-top:-20px;max-height:46%;display:flex;flex-direction:column;gap:10px;box-sizing:border-box;padding-block:16px 14px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));background:var(--bg);color:var(--ink);border-radius:30px 30px 0 0;overflow-y:auto}
.notes{display:flex;flex-direction:column;gap:6px}
.note{width:100%;display:flex;align-items:center;gap:10px;min-height:44px;border:0;background:none;padding:0;text-align:start;font-size:17px;overflow-wrap:anywhere}
.note .n{width:30px;height:30px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--gold);color:var(--ink);border-radius:50%;font-size:15px;font-weight:800}
.note.ok .n{background:var(--teal);color:#fff}

#nav{position:relative;flex:none;height:76px;box-sizing:border-box;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--bg);border-top:1px solid var(--line);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#nav.peek{position:absolute;inset-inline:0;bottom:0;z-index:15}
#nav button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border:0;background:none;color:var(--muted);font-size:13px;line-height:1.3}
#nav button[aria-current="page"]{color:var(--primary);font-weight:700}
#nav .bag{justify-content:flex-start;color:var(--primary);font-weight:700}
#nav .bag i{width:56px;height:56px;margin-top:-18px;display:flex;align-items:center;justify-content:center;background:var(--primary);color:var(--on-primary);border-radius:var(--pill);font-style:normal;position:relative}
#badge,.lab-badge{position:absolute;top:-2px;inset-inline-end:-2px;min-width:22px;height:22px;display:flex;align-items:center;justify-content:center;background:var(--gold);color:var(--ink);border-radius:11px;font-size:13px;font-weight:800}

.group{display:flex;flex-direction:column;gap:6px}

#busy{position:absolute;inset:0;z-index:25;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(255,255,255,.96);text-align:center;padding:30px}

#fx{position:absolute;inset:0;width:100%;height:100%;z-index:45;pointer-events:none}
#fxLayer{position:absolute;inset:0;z-index:44;pointer-events:none;overflow:hidden}
.fx-clone{position:absolute}

.has-rip{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;background:currentColor;pointer-events:none}
.ring{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;border:5px solid var(--gold);box-sizing:border-box}
.add-card{position:absolute;top:14px;inset-inline:34px;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg);color:var(--ink);border-radius:var(--r);box-shadow:0 12px 30px rgba(42,22,32,.32);font-weight:700}

#splash{position:absolute;inset:0;z-index:60;background:var(--primary);display:flex;align-items:center;justify-content:center;overflow:hidden}

.name-b{position:relative;font-size:64px;font-weight:800;color:#fff;line-height:1.3}
.name-bubble{position:absolute;left:50%;top:50%;width:190px;height:190px;margin:-95px 0 0 -95px;background:rgba(255,255,255,.2);border:4px solid var(--gold);border-radius:50%;box-sizing:border-box}

#splash b.shine,.name-b.shine{background:linear-gradient(100deg,#fff 38%,var(--gold) 50%,#fff 62%);background-size:320% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}

.spin{width:52px;height:52px;border-radius:50%;border:6px solid var(--primary-soft);border-top-color:var(--primary);animation:spin .9s linear infinite}

.lab-stage .spin,.act-card .spin{border-color:var(--bg);border-top-color:var(--primary)}
.ok-wrap{position:relative;width:124px;height:124px;display:flex;align-items:center;justify-content:center}
.ok-wrap svg{width:112px;height:112px;position:relative}

.ok-p{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}

.stamp{padding:8px 22px;border:5px solid var(--coral);color:var(--coral);font-size:30px;font-weight:800;border-radius:14px;transform:rotate(-10deg);white-space:nowrap}

.amb{position:absolute;inset:0;overflow:hidden;z-index:-1;pointer-events:none;display:none}
.amb i{position:absolute;border-radius:50%;opacity:.15}

.amb i:nth-child(1){width:130px;height:130px;background:var(--primary);top:3%;left:-34px;animation:drift1 8s ease-in-out infinite}
