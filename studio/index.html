<!DOCTYPE html>
<html dir="rtl" lang="ar"><head><meta charset="utf-8"/><meta name="lahza-home" content="../"/><meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/><meta content="#FFFBFC" name="theme-color"/><meta content="yes" name="apple-mobile-web-app-capable"/><meta content="default" name="apple-mobile-web-app-status-bar-style"/><meta content="yes" name="mobile-web-app-capable"/><meta content="لحظة — تصميم ثيم المناسبة ومعاينته على المنتج وتوزيع نسخه على ورق الطباعة." name="description"/><title>استوديو لحظة</title><link href="./favicon.svg" rel="icon" type="image/svg+xml"/><link href="./styles.css?v=202611131215" rel="stylesheet"/><link href="./enhancements.css?v=202611131215" rel="stylesheet"/><link href="./theme.css?v=202611131215" rel="stylesheet"/><link href="./customize.css?v=202611131215" rel="stylesheet"/><link href="./layout.css?v=202611131215" rel="stylesheet"/></head><body>
<div aria-live="polite" class="toast" id="toast" role="status"></div>
<div class="site-shell" id="siteShell" hidden="">
<!-- The studio is for designing only (Record 18). These hidden lists keep the ids app.js fills. -->
<button id="languageBtn" type="button" hidden="">EN</button>
<section id="homeView"><div id="occasionGrid"></div><div id="featuredTemplates"></div><div id="productsGrid"></div><div class="hero-showcase"><canvas id="heroBottleCanvas" width="10" height="10"></canvas></div><span id="footerYear"></span></section>
<section id="templatesView"><div id="templateFilters"></div><div id="allTemplatesGrid"></div></section>
<section id="projectsView"><input id="importProjectInput" type="file" accept="application/json,.json" hidden=""/></section>
</div>

<section class="st" id="startScreen" hidden="" aria-label="بداية الاستديو">
<header class="st-head">
<button class="wsb-home" id="startHomeBtn" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>الرئيسية</span></button>
<span class="st-brand">استوديو لحظة</span>
</header>
<h1 class="st-title">من وين نبدأ؟</h1>
<button class="st-new" id="startNewBtn" type="button">
<span class="st-new-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
<span class="st-new-text"><strong>تصميم جديد</strong><small>صفحة فاضية على المنتج المختار</small></span>
</button>
<div class="st-pair">
<button class="st-card" id="startTemplatesBtn" type="button"><span class="st-thumbs" aria-hidden="true"><i style="background:#F9F4E6"></i><i style="background:#FFFAF4"></i><i style="background:#FEF8FC"></i></span><span class="st-card-text"><strong>قوالب جاهزة</strong><small id="startTemplatesCount">قوالب للمناسبات</small></span></button>
<button class="st-card" id="startMineBtn" type="button"><span class="st-icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg></span><span class="st-card-text"><strong>تصاميمي</strong><small id="startMineCount">محفوظة على هذا الجهاز</small></span></button>
</div>
<div class="st-row-head"><h2>آخر التصاميم</h2><button class="st-link" id="startAllBtn" type="button">الكل</button></div>
<div class="st-recent" id="startRecent"></div>
</section>

<section class="wsb" hidden="" id="workspace">
<div class="preview-frame wsb-stage" id="previewFrame">
<canvas aria-label="معاينة ثلاثية الأبعاد" id="bottleCanvas"></canvas>
<canvas aria-label="لوحة التصميم" hidden="" id="flatCanvas"></canvas>
</div>
<header class="wsb-top">
<button class="wsb-home" id="exitEditor" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span id="homeLabel">الرئيسية</span></button>
<div class="wsb-toggle" role="group" aria-label="طريقة العرض">
<button class="view-tab active" data-view="3d" id="show3DBtn" type="button">3D</button>
<button class="view-tab" data-view="flat" id="showFlatBtn" type="button">مسطح</button>
</div>
<button class="wsb-next" id="openPrintBtn" type="button">التالي</button>
</header>
<div class="wsb-undo">
<button class="wsb-round wsb-small" id="undoBtn" type="button" aria-label="تراجع"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14l-4-4 4-4M5 10h9a5 5 0 0 1 0 10h-3"/></svg></button>
<button class="wsb-round wsb-small" id="redoBtn" type="button" aria-label="إعادة"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l4-4-4-4M19 10h-9a5 5 0 0 0 0 10h3"/></svg></button>
</div>
<nav class="wsb-rail" id="desktopTools" aria-label="أدوات التصميم">
<button class="wsb-tool wsb-tool-dark" data-tool="text" type="button" aria-label="إضافة نص"><span class="wsb-aa">Aa</span></button>
<button class="wsb-tool" data-tool="background" type="button" aria-label="الخلفية والألوان"><span class="wsb-wheel"></span></button>
<button class="wsb-tool" data-tool="upload" type="button" aria-label="إضافة صورة"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg></button>
<button class="wsb-tool" data-tool="sticker" type="button" aria-label="أشكال"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/></svg></button>
<button class="wsb-tool" data-tool="layers" type="button" aria-label="الطبقات"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5"/></svg></button>
<button class="wsb-tool" id="moreBtn" type="button" aria-label="المزيد"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></button>
</nav>
<div class="stage-controls wsb-3d" id="stageControls">
<p class="wsb-hint3d">السحب يلف المنتج · السحب على العنصر يحرّكه · إصبعين للتكبير</p>
<div hidden=""><button id="rotateLeft" type="button">↶</button><button id="rotateRight" type="button">↷</button><button id="zoomOut" type="button">−</button><button id="zoomIn" type="button">+</button><button class="mode-btn active" id="editOnBottle" type="button">تحريك</button><button class="mode-btn" id="spinBottle" type="button"><span id="spinLabel">لف المنتج</span></button></div>
</div>
<div class="wsb-bottom">
<div aria-label="العنصر المحدد" class="selection-quickbar wsb-pill" hidden="" id="selectionQuickbar">
<button id="editSelectedBtn" type="button" class="wsb-pill-main">✎ تعديل</button>
<strong id="selectedItemLabel" class="wsb-pill-label">عنصر محدد</strong>
<button id="duplicateSelectedBtn" type="button">⧉ نسخ</button>
<button aria-label="حذف العنصر" class="selection-delete" id="deleteSelectedBtn" type="button"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
</div>
<div class="wsb-colors" id="quickColors" role="group" aria-label="ألوان سريعة"></div>
</div>
<div class="wsb-scrim" id="wsbScrim" hidden=""></div>
<aside class="wsb-sheet wsb-more" id="moreSheet" aria-label="المزيد">
<div class="wsb-sheet-head"><h3>تصميمك</h3><button class="wsb-round wsb-small" id="closeMore" type="button" aria-label="إغلاق"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
<div class="wsb-sheet-body">
<label class="wsb-field">اسم التصميم<input class="project-title-input" id="projectTitle" maxlength="55" value="تصميم جديد"/></label>
<small class="wsb-save" id="saveState">الحفظ محليًا تلقائيًا</small>
<div class="wsb-product"><div class="product-summary" id="productSummary"></div></div>
<div class="wsb-meta"><strong id="stageTitle">قارورة مياه</strong><span class="size-chip" id="sizeChip">190 × 50 مم</span></div>
<div class="wsb-grid">
<button class="wsb-item" id="cloneDesignBtn" type="button">▣ نسخ التصميم لمنتجات أخرى</button>
<button class="wsb-item" id="newDesignBtn" type="button">＋ تصميم جديد</button>
<button class="wsb-item" id="startScreenBtn" type="button">⌂ شاشة البداية</button>
<button class="wsb-item" id="myDesignsBtn" type="button">◷ تصاميمي</button>
<button class="wsb-item" id="changeProductBtn" type="button">⇄ تغيير المنتج أو المقاس</button>
<button class="wsb-item" id="sizeSettingsBtn" type="button">↔ ضبط المقاس</button>
<button class="wsb-item" id="downloadMockupBtn" type="button">↓ <span>تنزيل صورة المنتج</span></button>
<button class="wsb-item" id="saveProjectBtn" type="button">✓ حفظ الآن</button>
<button class="wsb-item" id="helpBtn" type="button">؟ مساعدة</button>
</div>
<div class="wsb-guides" role="group" aria-label="أدلة الرسم">
<button aria-pressed="true" class="studio-chip active" data-guide="safe" type="button">هامش الأمان</button>
<button aria-pressed="true" class="studio-chip active" data-guide="center" type="button">خط المنتصف</button>
<button aria-pressed="true" class="studio-chip active" data-guide="snap" type="button">محاذاة ذكية</button>
</div>
<p class="spec-warning" id="printWarning"></p>
<p class="wsb-hint" id="previewHint">المعاينة تتحدث مع كل تعديل</p>
</div>
</aside>
<aside class="wsb-sheet" id="propertyPanel" aria-label="تعديل التصميم">
<div class="wsb-sheet-head"><h3>تعديل التصميم</h3><button class="wsb-round wsb-small" id="closeProperties" type="button" aria-label="إغلاق"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
<div class="property-scroll" id="propertiesContent"></div>
</aside>
<div hidden="">
<button id="undoMobile" type="button">↶</button><button id="redoMobile" type="button">↷</button>
<button id="focusModeBtn" type="button">⛶</button><button id="cloneDesignMobile" type="button">▣</button>
</div>
</section>
<div class="modal-backdrop" hidden="" id="modalBackdrop"><div aria-modal="true" class="modal" id="modal" role="dialog"><button aria-label="إغلاق" class="modal-close icon-button" id="closeModal">×</button><div id="modalContent"></div></div></div>
<input accept="image/*,.heic,.heif" hidden="" id="imageInput" multiple="" type="file"/>
<script defer="" src="./app.js?v=202611131215"></script><script defer="" src="./customize.js?v=202611131215"></script><script defer="" src="./layout.js?v=202611131215"></script>
</body>
</html>
